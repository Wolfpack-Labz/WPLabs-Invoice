<article class="story-card" data-category="{{ include.post.category | escape }}" data-search="{{ include.post.title | append: ' ' | append: include.post.category | append: ' ' | append: include.post.summary | append: ' ' | append: include.post.search_keywords | escape }}">
  <a aria-hidden="true" class="story-art {{ include.post.art_color }}" href="{{ include.post.url | relative_url }}" tabindex="-1">
    <span class="art-label">{{ include.post.category }}</span>
    <span class="art-title">{{ include.post.art_title }}</span>
    <span class="art-number">FIELD NOTES / {{ include.post.field_note }}</span>
  </a>
  <div class="story-copy">
    <span class="meta">{{ include.post.category }} · {{ include.post.read_time }}</span>
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    <p>{{ include.post.summary }}</p>
    <a class="text-link" href="{{ include.post.url | relative_url }}">Read the guide<span class="sr-only">: {{ include.post.title }}</span></a>
  </div>
</article>
